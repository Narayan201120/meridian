name: CI

# The blank-screen class of bug nearly shipped twice in one session, and every
# check below passes locally while nothing runs it automatically. This runs the
# full gate on every push and pull request.
#
# The E2E job runs two suites in sequence because they test different things
# under different conditions. `e2e:demo` has no backend and proves the styling
# pipeline compiled; `e2e:live` boots the real API and proves the data path
# works. Neither can substitute for the other: demo mode returns early at the
# first line of every polling hook, so a reminder system driven only by a
# browser `setInterval` cannot fail there no matter how broken it is.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned rather than `ubuntu-latest`, which migrates to Ubuntu 26 imminently.
# An image change with no commit is exactly the kind of surprise this workflow
# exists to catch, so it should not be the thing that introduces one.
env:
  RUNNER: ubuntu-24.04

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ${{ env.RUNNER }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `e2e_server.py` is the harness the End-to-end job boots, so it is held to
      # the same bar as the app. Leaving it unlinted would let the thing CI most
      # depends on rot without noticing.
      - name: Ruff
        run: ruff check app tests e2e_server.py

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend typecheck
    runs-on: ${{ env.RUNNER }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  e2e:
    name: End-to-end
    runs-on: ${{ env.RUNNER }}
    defaults:
      run:
        working-directory: frontend
    env:
      # Use the bundled Chromium rather than system Chrome, which the
      # playwright.config.ts default assumes for local machines where
      # cdn.playwright.dev is unreachable.
      E2E_BROWSER_CHANNEL: ""
    steps:
      - uses: actions/checkout@v7

      # The live suite starts `backend/e2e_server.py`, so the runner needs
      # Python and the backend dependencies. This is the step that was missing
      # when the suite only ever ran against demo fixtures, which is part of why
      # nobody noticed it never touched a backend.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend for the E2E harness
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E demo mode
        run: bun run e2e:demo

      - name: E2E live backend
        run: bun run e2e:live

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore